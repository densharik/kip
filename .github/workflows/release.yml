name: Release

# Every push to main is a release, versioned 0.1.<commit-count>. The in-app
# updater compares its embedded version against the latest release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      patch: ${{ steps.v.outputs.patch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: v
        run: |
          P=$(git rev-list --count HEAD)
          echo "patch=$P" >> "$GITHUB_OUTPUT"
          echo "version=0.1.$P" >> "$GITHUB_OUTPUT"

  windows:
    needs: meta
    runs-on: windows-latest
    env:
      KIP_PATCH: ${{ needs.meta.outputs.patch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --release
      - run: cargo build --release
      - name: Stage artifact
        shell: bash
        run: |
          mkdir dist
          cp target/release/kip.exe dist/kip.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kip-windows
          path: dist/kip.exe

  macos:
    # macos-latest is Apple Silicon, so this builds arm64 natively in one pass.
    # Intel Macs run it through Rosetta 2.
    needs: meta
    runs-on: macos-latest
    env:
      KIP_PATCH: ${{ needs.meta.outputs.patch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --release
      - name: Build (Apple Silicon)
        run: |
          cargo build --release
          mkdir -p dist
          cp target/release/kip dist/kip
      - name: Bundle kip.app
        env:
          KIP_CODESIGN_P12: ${{ secrets.KIP_CODESIGN_P12 }}
          KIP_CODESIGN_PASS: ${{ secrets.KIP_CODESIGN_PASS }}
        run: |
          APP=dist/kip.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp dist/kip "$APP/Contents/MacOS/kip"
          chmod +x "$APP/Contents/MacOS/kip"
          cp resources/kip-ctx-hook.sh "$APP/Contents/Resources/"
          cp resources/icon.icns "$APP/Contents/Resources/kip.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>kip</string>
            <key>CFBundleDisplayName</key><string>kip</string>
            <key>CFBundleIdentifier</key><string>com.densharik.kip</string>
            <key>CFBundleVersion</key><string>${{ needs.meta.outputs.version }}</string>
            <key>CFBundleShortVersionString</key><string>${{ needs.meta.outputs.version }}</string>
            <key>CFBundleExecutable</key><string>kip</string>
            <key>CFBundleIconFile</key><string>kip</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSServices</key>
            <array>
              <dict>
                <key>NSMenuItem</key>
                <dict><key>default</key><string>New kip Window Here</string></dict>
                <key>NSMessage</key><string>openInKip</string>
                <key>NSPortName</key><string>kip</string>
                <key>NSRequiredContext</key>
                <dict><key>NSTextContent</key><string>FilePath</string></dict>
                <key>NSSendTypes</key>
                <array>
                  <string>NSFilenamesPboardType</string>
                  <string>public.plain-text</string>
                </array>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST
          # A fixed self-signed certificate, not ad-hoc: macOS ties Screen
          # Recording and other permissions to the signing identity, and an
          # ad-hoc identity is the binary's hash, so every update asked again.
          KC="$RUNNER_TEMP/kip.keychain-db"
          security create-keychain -p kip "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p kip "$KC"
          echo "$KIP_CODESIGN_P12" | base64 --decode > "$RUNNER_TEMP/kip.p12"
          security import "$RUNNER_TEMP/kip.p12" -k "$KC" -P "$KIP_CODESIGN_PASS" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/kip.p12"
          security set-key-partition-list -S apple-tool:,apple: -k kip "$KC" > /dev/null
          security list-keychains -d user -s "$KC"
          codesign --force --deep --keychain "$KC" -s 0469D81EBBD12F26E281C6D14D396E3CB8A1F21F "$APP"
          codesign -dr - "$APP" 2>&1 | grep -q 'certificate leaf = H"0469d81ebbd12f26e281c6d14d396e3cb8a1f21f"'
          security delete-keychain "$KC"
      - name: Zip (for the in-app updater and manual install)
        run: ditto -c -k --keepParent dist/kip.app dist/kip-macos.zip
      - name: Build .pkg installer
        run: |
          mkdir -p pkgroot pkgscripts
          cp -R dist/kip.app pkgroot/
          # Give the installed app to the logged-in user. The in-app updater
          # then tries an in-place swap first (passwordless when /Applications
          # is writable, e.g. for admins), and falls back to this .pkg with a
          # password prompt when macOS blocks replacing the bundle.
          cat > pkgscripts/postinstall <<'SH'
          #!/bin/sh
          u="${INSTALL_PKG_SESSION_OWNER:-$(/usr/bin/stat -f%Su /dev/console)}"
          if [ -n "$u" ] && [ "$u" != "root" ] && [ "$u" != "loginwindow" ]; then
            /usr/sbin/chown -R "$u:staff" "/Applications/kip.app"
          fi
          exit 0
          SH
          chmod +x pkgscripts/postinstall
          pkgbuild --root pkgroot \
            --identifier com.densharik.kip \
            --version "${{ needs.meta.outputs.version }}" \
            --scripts pkgscripts \
            --install-location /Applications \
            dist/kip-installer.pkg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kip-macos
          path: |
            dist/kip-macos.zip
            dist/kip-installer.pkg

  release:
    needs: [meta, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Sign assets for the in-app updater
        env:
          KIP_SIGN_KEY: ${{ secrets.KIP_SIGN_KEY }}
        run: |
          test -n "$KIP_SIGN_KEY"
          umask 077
          printf '%s\n' "$KIP_SIGN_KEY" > "$RUNNER_TEMP/key.pem"
          # Must be the key whose public half is SIGN_KEY in src/update.rs,
          # or no installed kip would accept this release.
          pub=$(openssl pkey -in "$RUNNER_TEMP/key.pem" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d " \n")
          test "$pub" = a00169efb6bb8a9779756d6be71b09c3a1d16435ca9b66d3a0cd3ab3297b9582
          # Signed message: "kip <version> <asset>\n" + file (see verify in update.rs).
          for f in artifacts/kip-windows/kip.exe artifacts/kip-macos/kip-macos.zip; do
            { printf 'kip %s %s\n' "${{ needs.meta.outputs.version }}" "$(basename "$f")"; cat "$f"; } > "$RUNNER_TEMP/msg"
            openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in "$RUNNER_TEMP/msg" -out "$f.sig"
            test "$(wc -c < "$f.sig")" -eq 64
          done
          rm "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/msg"
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: v${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/kip-windows/kip.exe
            artifacts/kip-windows/kip.exe.sig
            artifacts/kip-macos/kip-macos.zip
            artifacts/kip-macos/kip-macos.zip.sig
            artifacts/kip-macos/kip-installer.pkg
          generate_release_notes: true
