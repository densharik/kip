[package]
name = "kip"
version = "0.1.3"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
dirs = "6.0.0"
eframe = "=0.35.0" # pinned: vendor/eframe patches this exact version, see [patch.crates-io]
egui = "0.35.0"
regex = "1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
# Only the classes the Finder Services provider and the Cmd+V monitor touch; the
# default feature set drags in Metal/CoreImage/etc. and bloats build time.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSPasteboard", "NSEvent", "NSMenu", "NSMenuItem", "block2"] }
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
] }

[profile.release]
lto = "thin"
strip = true

# eframe with one fix: the UI stalled for good once every window had been
# minimized (see vendor/eframe/src/native/wgpu_integration.rs, "kip patch").
# Cargo silently ignores this patch once eframe's version moves on. Before
# bumping egui/eframe: check upstream fixed it, or carry the "kip patch"
# lines into a fresh vendor copy of the new version.
[patch.crates-io]
eframe = { path = "vendor/eframe" }
